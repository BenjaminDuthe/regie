# regie — CI bloquante, à chaque push (AD-19).
# Le job « suites » lance exactement `npm run ci`, comme en local.
# Images épinglées par empreinte (deploiement/versions.json) ; aucune action tierce :
# le dépôt est récupéré par git, avec le jeton éphémère du run.

name: ci

on:
  push:

jobs:
  suites:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: docker.io/library/node:26.5.0-trixie@sha256:0473e7dc433a1310f436edee02aa79737ec78a4b345433ab0963d4a256f9ad85
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - name: Récupérer le dépôt (historique complet, pour le scan de secrets)
        env:
          JETON: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraHeader="Authorization: Basic $(printf 'jeton:%s' "$JETON" | base64 -w0)" \
            fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "${{ github.sha }}"
          git log -1 --oneline

      - name: Installer gitleaks (somme SHA-256 vérifiée)
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  /tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Suites bloquantes (npm run ci)
        run: npm run ci

  python:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: docker.io/library/python:3.14.8-trixie@sha256:4dbad2306cac8f917443403b7b1144384ea6af87c9e8d08b53c36053ceb016c3
    steps:
      - name: Récupérer le dépôt
        env:
          JETON: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraHeader="Authorization: Basic $(printf 'jeton:%s' "$JETON" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q --detach FETCH_HEAD

      - name: Installer les dépendances Python (pip --require-hashes)
        run: |
          set -eu
          python3 --version
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check --require-hashes -r requirements.lock
          /tmp/venv/bin/python -c "import pydantic, datamodel_code_generator; print('pydantic', pydantic.VERSION)"

  # Résultat publié sur le commit GitHub (contexte « forgejo/ci »), visible dans la PR
  # avant la fusion sur main (histoire 0.4). Le secret GITHUB_STATUTS est un jeton GitHub
  # à portée fine : « Commit statuses: write » sur BenjaminDuthe/regie seulement.
  # Aucun lien vers Forgejo : son adresse est locale et n'a pas à être publiée.
  statut-github:
    runs-on: docker
    needs: [suites, python]
    if: always()
    timeout-minutes: 5
    container:
      image: docker.io/library/node:26.5.0-trixie@sha256:0473e7dc433a1310f436edee02aa79737ec78a4b345433ab0963d4a256f9ad85
    steps:
      - name: Publier le statut sur GitHub
        env:
          JETON_GITHUB: ${{ secrets.GITHUB_STATUTS }}
          SUITES: ${{ needs.suites.result }}
          PYTHON: ${{ needs.python.result }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$JETON_GITHUB" ]; then
            # Le résultat reste visible sur Forgejo ; sur GitHub, le commit n'a pas de statut et la
            # protection de main (qui exige forgejo/ci) bloque donc la fusion.
            echo "::warning::Secret GITHUB_STATUTS absent : statut non publié sur GitHub."
            exit 0
          fi
          if [ "$SUITES" = success ] && [ "$PYTHON" = success ]; then
            etat=success; texte="suites et python au vert"
          else
            etat=failure; texte="suites : $SUITES, python : $PYTHON"
          fi
          printf '{"state":"%s","context":"forgejo/ci","description":"%s"}' "$etat" "$texte" >/tmp/statut.json
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: Bearer $JETON_GITHUB" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/statut.json \
            "https://api.github.com/repos/BenjaminDuthe/regie/statuses/$COMMIT"
          echo "Statut « $etat » publié sur GitHub pour $COMMIT."
