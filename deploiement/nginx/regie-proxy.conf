# Inclus dans chaque location qui relaie vers le cœur (regie.conf).
# Les en-têtes d'adresse sont réécrits depuis $remote_addr : une valeur forgée
# par le visiteur ne passe jamais.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-Connecting-IP  "";
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 1s;   # réseau local ; un port fermé du CT 140 ne renvoie pas de RST (jeté par le pare-feu)
proxy_read_timeout 60s;
proxy_intercept_errors off;
