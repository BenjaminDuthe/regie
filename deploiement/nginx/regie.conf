# regie.etablia.fr — histoire 0.3
#
# Installé dans le CT 101 (nginx) : /etc/nginx/sites-available/regie.etablia.fr.conf,
# lien dans sites-enabled. Le nom exact passe avant le joker regex *.etablia.fr
# d'etablia.conf : rien d'autre n'est touché.
#
# Chemin : tunnel Cloudflare (cloudflared du CT 101, vers https://localhost:443)
# → ce bloc → cœur sur le CT 140 (port 4321).
# Tant que le cœur ne répond pas, toute page renvoie la page d'attente (503).
# Certificat : joker etablia.fr, renouvelé par certbot (DNS-01 Cloudflare).

# Chemin demandé, coupé avant « ? » : la chaîne de requête (code OIDC, jetons)
# n'est jamais journalisée. $uri ne convient pas : il devient /attente.html
# après la redirection interne vers la page d'attente.
map $request_uri $regie_chemin {
    ~^(?<chemin>[^?]*) $chemin;
}

log_format regie '$remote_addr [$time_local] "$request_method $regie_chemin $server_protocol" '
                 '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name regie.etablia.fr;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    access_log /var/log/nginx/regie-access.log regie;

    location / { return 301 https://regie.etablia.fr$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name regie.etablia.fr;

    # IP réelle du visiteur, et refus de tout ce qui ne passe pas par Cloudflare.
    # Le tunnel arrive de localhost : seul cloudflared s'y connecte dans le CT 101.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    include /etc/nginx/snippets/cloudflare-allow.conf;

    ssl_certificate /etc/letsencrypt/live/etablia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etablia.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/etablia.fr/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'" always;

    access_log /var/log/nginx/regie-access.log regie;
    # Le journal d'erreurs recopie la ligne de requête complète : seulement le critique.
    error_log /var/log/nginx/regie-error.log crit;

    limit_req zone=global burst=100 nodelay;
    limit_conn conn_limit 30;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 10m;
    client_body_timeout 15s;

    error_page 502 503 504 =503 @attente;

    location / {
        proxy_pass http://192.168.20.140:4321;
        include /etc/nginx/snippets/regie-proxy.conf;
    }

    # Connexion, retour OIDC et échange de jetons OAuth : limite renforcée (1 req/s par IP).
    # Les chemins sont ceux du cœur (coeur/src/routes-publiques.ts) : /connexion, /connexion/retour, /oauth/token…
    location /connexion {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://192.168.20.140:4321;
        include /etc/nginx/snippets/regie-proxy.conf;
    }
    location /oauth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://192.168.20.140:4321;
        include /etc/nginx/snippets/regie-proxy.conf;
    }

    location @attente {
        root /var/www/regie;
        try_files /attente.html =503;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }
}
