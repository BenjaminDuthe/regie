# regie — environnement de développement sur Mac (profil « cpu », aucun secret réel).
# Lancé par `npm run dev` : podman compose s'il est installé, sinon docker compose.
# PostgreSQL et ses secrets de développement rejoindront ce profil avec l'installation (reporté de l'histoire 1.4).

name: regie-dev

services:
  coeur:
    profiles: ["cpu"]
    build:
      context: ..
      dockerfile: deploiement/images/coeur.Containerfile
    environment:
      NODE_ENV: development
      HOTE: 0.0.0.0
      PORT: "4321"
    ports:
      - "127.0.0.1:4321:4321"
